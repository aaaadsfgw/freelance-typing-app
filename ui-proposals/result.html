<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freelance Desk — 結果</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/screens.css" />
  </head>
  <body class="theme-c">
    <nav class="mock-nav">
      <span class="logo-mark">F</span>
      <span class="brand">Freelance Desk</span>
      <a href="index.html">比較</a>
      <a href="title.html">タイトル</a>
      <a href="game-a.html">ゲーム A</a>
      <a href="game-b.html">ゲーム B</a>
      <a href="game-c.html">ゲーム C</a>
      <a class="is-active" href="result.html">結果</a>
      <a href="analysis.html">分析</a>
    </nav>

    <main class="page">
      <section class="panel">
        <div class="result-hero">
          <div class="kicker">今月の売上</div>
          <div class="amount">¥842,000</div>
          <div class="chip" style="background: var(--violet-soft); color: var(--violet)">売れっ子エンジニア</div>
          <p class="rank-banner">売れっ子エンジニア。予定表が埋まり始めています。</p>
        </div>

        <div class="stat-grid stat-grid-dark">
          <div class="stat">
            <div class="label">入力速度</div>
            <div class="value">412 打/分</div>
          </div>
          <div class="stat">
            <div class="label">正確性</div>
            <div class="value">97.2%</div>
          </div>
          <div class="stat">
            <div class="label">ミス数</div>
            <div class="value">18</div>
          </div>
          <div class="stat">
            <div class="label">最大コンボ</div>
            <div class="value">86</div>
          </div>
          <div class="stat">
            <div class="label">完了案件</div>
            <div class="value">14 件</div>
          </div>
          <div class="stat">
            <div class="label">平均案件単価</div>
            <div class="value">¥60,143</div>
          </div>
        </div>

        <div class="actions" style="padding: 0 28px 28px">
          <a class="btn btn-primary" href="game-c.html">同じ難易度で再挑戦</a>
          <a class="btn btn-ghost" href="title.html">難易度を変更</a>
          <a class="btn btn-soft" href="analysis.html">タイピング分析</a>
        </div>
      </section>
    </main>
  </body>
</html>
